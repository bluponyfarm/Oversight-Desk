function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(v){return esc(v);}function cleanUrl(v){try{const u=new URL(String(v));return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};
function link(v,label='Source ↗'){const u=cleanUrl(v);return u?`<a href="${attr(u)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:''}
function today(){return new Date().toISOString().slice(0,10)}
function id(){return 'rec_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE_KEY));if(x && x.version===1 && Array.isArray(x.inquiries)&&x.inquiries.length===160 && Array.isArray(x.areas))return x;}catch(e){}return structuredClone(BOOTSTRAP)}
function persist(){data.updated=new Date().toISOString();try{localStorage.setItem(STORE_KEY,JSON.stringify(data));}catch(e){toast('Browser storage unavailable. Export a backup after edits.')}render()}
function toast(s){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',3300)}
function download(filename,content,type){const blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function getArea(id){return data.areas.find(a=>a.id===id)}
function getInquiry(id){return data.inquiries.find(x=>x.id===id)}
function getMember(id){return data.members.find(x=>x.id===id)}
function getCommittee(id){return data.committees.find(x=>x.id===id)}
function findAreaId(x){return (x||[]).map(getArea).filter(Boolean).map(a=>a.name).join(', ')}
function areaInquiries(aid){return data.inquiries.filter(x=>x.areaId===aid)}
function areaCommittees(aid){return data.committees.filter(x=>x.areaIds?.includes(aid))}
function flagsForMember(mid){return data.flags.filter(f=>f.memberId===mid)}
function verifiedFlags(){return data.flags.filter(f=>f.review==='documented' && cleanUrl(f.source))}
function isChecked(s){return s!=='unassessed'}
function isUnderway(s){return ['active','findings','action'].includes(s)}
function chip(s){return `<span class="chip" data-status="${esc(s)}">${esc(STATUS[s]||s)}</span>`}
function areaCounts(aid){const items=areaInquiries(aid);return {total:items.length,checked:items.filter(x=>isChecked(x.status)).length,underway:items.filter(x=>isUnderway(x.status)).length,active:items.filter(x=>x.status==='active').length,findings:items.filter(x=>['findings','action'].includes(x.status)).length,notAssessed:items.filter(x=>x.status==='unassessed').length,by:Object.fromEntries(Object.keys(STATUS).map(s=>[s,items.filter(x=>x.status===s).length]))}}
function render(){document.getElementById('nav').innerHTML=[['overview','⌂  Overview'],['inquiries','≡  Inquiry ledger'],['committees','♙  Committees & members'],['connections','⚑  Connections'],['evidence','▤  Evidence log'],['sources','↗  Research sources']].map(([key,label])=>`<button data-nav="${key}" class="${view===key?'active':''}" aria-current="${view===key?'page':'false'}">${label}</button>`).join('');

`<div class="sectionbar"><h2>How to read this dashboard</h2></div><div class="panel"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px"><div><strong>1. Document the activity</strong><p class="smalltext">Give each inquiry a status, date, source, and notes. “No public action found” requires an actual search.</p></div><div><strong>2. Name the committee</strong><p class="smalltext">Add a House or Senate committee, its members, their roles, and the official roster source.</p></div><div><strong>3. Review possible connections</strong><p class="smalltext">Record a specific tie with a citation. A 🚩 is a research prompt, not a verdict.</p></div><div><strong>4. Export your work</strong><p class="smalltext">Download a JSON backup for editing later or a read-only HTML snapshot to share.</p></div></div></div>`;}
function meter(c){return `<div class="meter">${Object.keys(STATUS).map(s=>c.by[s]?`<span class="seg" style="background:${COLOR[s]};width:${(100*c.by[s]/c.total).toFixed(2)}%"></span>`:'').join('')}</div>`}
function legend(){return `<div class="legend">${[['unassessed','Not assessed'],['no_public','Checked / none found'],['announced','Announced'],['active','Underway'],['findings','Findings'],['action','Follow-through'],['paused','Paused'],['closed','Closed']].map(([s,n])=>`<span><b style="background:${COLOR[s]}"></b>${esc(n)}</span>`).join('')}</div>`}

function connectionsPage(){return header('Follow the evidence','Documented connections','Record a specific link between a committee member and an individual, organization, contract, or interest relevant to oversight. A 🚩 is not an accusation or proof of misconduct.',`<button class="btn btn-primary" data-editflag>＋ Add connection</button>`)+`<div class="notice" style="margin-bottom:20px">⚑ Flags only count in dashboard totals after a source URL is recorded and the connection is marked “Sourced”. Campaign donations or ordinary professional contact do not, by themselves, establish a disqualifying conflict.</div>`+

function evidencePage(){const events=[...data.events].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return header('Dated, sourced record','Evidence & action log','Log hearings, subpoenas, testimony, reports, referrals, and documented pressure. A primary source or reliable report belongs with every entry.',`<button class="btn btn-primary" data-editevent>＋ Log an action</button>`)+`<div class="sectionbar"><h2>Timeline (${events.length} entries)</h2></div><div class="data-list">${events.length?events.map(ev=>`<div class="list-row"><div class="rowmain"><div class="rowtitle"><span class="idtag">${esc(ev.date||'Undated')}</span> &nbsp;${esc(ev.type)} · ${esc(ev.title||getInquiry(ev.inquiryId)?.id||'General record')}</div><div class="rowmeta">${ev.inquiryId?esc(ev.inquiryId)+' · ':''}${esc(ev.body||'Body not specified')} · ${link(ev.source)}</div><div class="report-note">${esc(ev.description)}</div></div><div class="right"><button class="btn mini" data-editevent="${esc(ev.id)}">Edit</button></div></div>`).join(''):'<div class="empty"><strong>No activity logged</strong>A dated, sourced entry will appear here when added.</div>'}</div>`;}
function sourcesPage(){const arr=[['House committee directory','Official House committee structure and jurisdiction','https://www.house.gov/committees'],['Senate committees','Official Senate committees and membership','https://www.senate.gov/committees/'],['House Clerk committee profiles','Committee and subcommittee information','https://clerk.house.gov/Committees'],['House financial disclosures','Public annual disclosures and transaction reports','https://disclosures-clerk.house.gov/FinancialDisclosure'],['Senate financial disclosures','Access rules and filings','https://www.ethics.senate.gov/public/index.cfm/financialdisclosure'],['Senate electronic disclosure search','Public Senate financial-disclosure records','https://efdsearch.senate.gov/search/home/'],['Federal Election Commission','Searchable campaign finance records','https://www.fec.gov/data/'],['Congress.gov','Bills, committee activity, hearings, legislative records','https://www.congress.gov/']];return header('Verification starting points','Official research sources','Useful primary-source starting points. Their availability does not verify any specific investigation, member assignment, or potential conflict.')+`<div class="source-grid">${arr.map(([t,d,u])=>`<div class="source"><a target="_blank" rel="noopener" href="${attr(u)}">${esc(t)} ↗</a><p>${esc(d)}</p></div>`).join('')}</div><div class="panel" style="margin-top:22px"><h3 style="margin-top:0">Editorial rules</h3><p class="smalltext">This tracker starts from a speaker’s proposed investigative questions, not adjudicated facts. Differentiate an official committee assignment from membership of a specific investigation. Verify whether oversight occurred using dated primary records and reliable reporting. Record contrary evidence and official explanations. A potential conflict is a connection to examine, not a conclusion about ethical violations.</p><p class="smalltext">Personal data stays inside this browser unless you export or share it. This one-file function showModal(title,body,onSave,onDelete){const root=document.getElementById('modalRoot');root.innerHTML=`<div class="modal-overlay" id="overlay"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle">${esc(title)}</h2><button class="close" id="closeModal" aria-label="Close">×</button></header><form id="modalForm"><div class="modal-body">${body}</div><div class="modal-footer"><div>${onDelete?'<button type="button" id="deleteRecord" class="btn btn-danger">Delete record</button>':''}</div><div style="display:flex;gap:9px"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn btn-primary" type="submit">Save changes</button></div></div></form></section></div>`;function close(){root.innerHTML=''}document.getElementById('closeModal').onclick=close;document.getElementById('cancelModal').onclick=close;document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')close()});document.getElementById('modalForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(onSave(fd)!==false){close();persist();toast('Saved locally')}});if(onDelete)document.getElementById('deleteRecord').onclick=()=>{if(confirm('Delete this record?')){onDelete();close();persist();toast('Record deleted')}};setTimeout(()=>root.querySelector('input,select,textarea')?.focus(),30)}

function shareSnapshot(){const escSnapshot=(s)=>esc(s);const assessed=data.inquiries.filter(x=>isChecked(x.status)),evs=[...data.events].sort((a,b)=>String(b.date).localeCompare(String(a.date))),flgs=verifiedFlags();const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Congressional Oversight Snapshot · ${today()}</title><style>body{font-family:system-ui,Arial;color:#203046;max-width:900px;margin:auto;padding:30px 22px;line-height:1.5}h1{font-size:32px}h2{margin-top:34px;padding-bottom:8px;border-bottom:2px solid #b5d9d3}p,small{color:#4f6173}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.box{border:1px solid #c4d7d5;border-radius:10px;padding:12px}.tag{font-size:12px;background:#e3eff0;border-radius:30px;padding:3px 7px}.item{padding:11px 0;border-bottom:1px solid #e3e9eb}a{color:#0d6b72}@media print{body{max-width:none}}</style></head><body><p><b>THE OVERSIGHT DESK</b> · 120th Congress · 2027–2028</p><h1>Congressional Performance Review</h1><p>Snapshot exported ${today()}. Independent records, not an official congressional report. Items not yet assessed must not be interpreted as inactive.</p><div class="grid">${data.areas.map(a=>{const c=areaCounts(a.id);return `<div class="box"><b>${escSnapshot(a.name)}</b><br><small>${c.checked}/${c.total} assessed · ${c.underway} active or later</small></div>`}).join('')}</div><h2>Investigative entries assessed (${assessed.length})</h2>${assessed.length?assessed.map(q=>`<div class="item"><strong>${escSnapshot(q.id)} · ${escSnapshot(q.title)}</strong><br><span class="tag">${escSnapshot(STATUS[q.status])}</span> <small>${escSnapshot(q.checked)}</small><p>${escSnapshot(q.note||'No notes')}</p>${link(q.source,'Source')}</div>`).join(''):'<p>No statuses have yet been assessed.</p>'}<h2>Public action log (${evs.length})</h2>${evs.length?evs.map(e=>`<div class="item"><strong>${escSnapshot(e.date)} · ${escSnapshot(e.type)} · ${escSnapshot(e.title)}</strong><p>${escSnapshot(e.description)}</p>${link(e.source,'Source')}</div>`).join(''):'<p>No events logged.</p>'}<h2>Documented connections (${flgs.length})</h2>${flgs.length?flgs.map(f=>`<div class="item"><strong>⚑ ${escSnapshot(getMember(f.memberId)?.name||'Unknown')} — ${escSnapshot(f.connectedTo)}</strong><p>${escSnapshot(f.description)} (${escSnapshot(f.type)})</p>${link(f.source,'Source')}</div>`).join(''):'<p>No source-backed connections recorded.</p>'}<hr><small>Flags indicate documented connections potentially relevant to a member's oversight role, not findings of improper conduct. Data compiled by the app user. Verify linked sources independently.</small></body></html>`;download('Congressional_Oversight_Snapshot_'+today()+'.html',html,'text/html;charset=utf-8');toast('Shareable read-only snapshot downloaded')}

function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.version!==1||!Array.isArray(j.inquiries)||j.inquiries.length!==160||!Array.isArray(j.areas)||j.areas.length!==16||!Array.isArray(j.committees)||!Array.isArray(j.members)||!Array.isArray(j.flags)||!Array.isArray(j.events))throw Error('This is not a compatible Oversight Desk backup.');if(!confirm('Replace all current local entries with the imported backup?'))return;data=j;persist();toast('Backup imported')}catch(e){alert('Could not import backup: '+e.message)}};r.readAsText(file)}
function navigate(to){view=to;if(to!=='inquiries')areaId=null;filterStatus='all';searchTerm='';render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||document.getElementById('modalRoot').contains(b))return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.area){areaId=b.dataset.area;view='inquiries';filterStatus='all';searchTerm='';render();window.scrollTo(0,0);return}if(b.hasAttribute('data-back')||b.hasAttribute('data-cleararea')){areaId=null;view=b.hasAttribute('data-back')?'overview':'inquiries';render();return}if(b.hasAttribute('data-editinquiry')){modalInquiry(b.dataset.editinquiry);return}if(b.hasAttribute('data-editcommittee')){modalCommittee(b.dataset.editcommittee||null,b.dataset.prefarea||'');return}if(b.hasAttribute('data-editmember')){modalMember(b.dataset.editmember||null);return}if(b.hasAttribute('data-editflag')){modalFlag(b.dataset.editflag||null);return}if(b.hasAttribute('data-editevent')){modalEvent(b.dataset.editevent||null);return}if(b.id==='backupBtn'){download('Oversight_Desk_Backup_'+today()+'.json',JSON.stringify(data,null,2),'application/json');toast('Full editable backup downloaded');return}if(b.id==='shareBtn'){shareSnapshot();return}if(b.id==='addBtn'){modalEvent();return}if(b.id==='importBtn'){document.getElementById('fileInput').click();return}if(b.id==='csvBtn'){csvExport();return}});
document.addEventListener('input',e=>{if(e.target.matches('[data-search]')){searchTerm=e.target.value;let p=e.target.selectionStart;render();const n=document.querySelector('[data-search]');n?.focus();try{n.setSelectionRange(p,p)}catch(e){}}});document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){filterStatus=e.target.value;render()}if(e.target.id==='fileInput'&&e.target.files[0]){importData(e.target.files[0]);e.target.value=''}});
render();
</script>
</body>
</html>
